<!DOCTYPE html>

<html>

<head>
    <title>SUNGUILT LEDGER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .rounded-box {
            background-color: wheat; /* Sets the background color */
            border: 4px wheat; /* Sets the border thickness, style, and color */
            border-radius: 15px; /* Rounds the corners */
            padding: 10px; /* Adds spacing inside the box so text won't touch edges */
            width: 20%;
        }
    </style>
</head>


<body style="background-image: url('./images/robber.jpeg'); background-size: 600px 600px">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <br><br>
    <center>
        <h3>SUNGUILT LEDGER</h3>
        <br><br><br><br>
        <br><br><br><br>

        <div class="rounded-box" id="inputOuter">
            <input type="file" id="csvFileInput" accept=".csv" />
        </div>

        <script>
            // IMPORT
            document.getElementById('csvFileInput').addEventListener('change', function (event) {
                console.log("clicked");
                const file = event.target.files[0];
                if (!file) {
                    console.log("no file found");
                    return;
                }

                const reader = new FileReader();
                console.log("below reader");

                reader.onload = function (e) {
                    console.log("on load");
                    const text = e.target.result;
                    const data = parseCSV(text);

                    const tableBody = document.querySelector('tbody');
                    const tableHead = document.querySelector('thead');

                    for (let i = 0; i < data.length; i++) {

                        const row = data[i].split(',')
                        let tr = document.createElement('tr');

                        for (let j = 0; j < row.length; j++) {
                            tr.innerHTML += '<td>' + row[j].replace('"', ''); + '</td>';
                        }

                        if (i == 0)
                            tableHead.append(tr);
                        else
                            tableBody.append(tr);
                    }
                    console.log(data);
                };

                reader.readAsText(file);
            });

            function parseCSV(text) {
                console.log("parse");
                const textSplit = text.split('\n');
                return textSplit;
            }

            // EXPORT
            function ExportClick() {
                const table = document.getElementById('myBootstrapTable');
                const rows = table.querySelectorAll('tr');
                let csvContent = '';

                for (let i = 0; i < rows.length; i++) {
                    const cols = rows[i].querySelectorAll('th, td');
                    const rowData = Array.from(cols);

                    for (let j = 0; j < rowData.length; j++) {

                        if (j == rowData.length - 1)
                            csvContent += rowData[j].innerText + '\r\n';
                        else
                            csvContent += rowData[j].innerText + ', ';
                    }
                }
                //    rows.forEach(row => {
                //        const cols = row.querySelectorAll('th, td');
                //    const rowData = Array.from(cols)
                //        .map(col => `"${col.innerText.replace(/"/g, '""')}"`) // Escape quotes
                //    .join(',');
                //csvContent += rowData + '\r\n';
                //});

                // Create a Blob and trigger download
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');

                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', 'bootstrap_table_data.csv');
                document.body.appendChild(link);

                link.click();
                document.body.removeChild(link);
            };

            // UPDATE
            function Update() {
                const newRow = document.createElement('tr');
                newRow.innerHTML = '<td><input type="text" class="form-control form-control-sm" placeholder="Date"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Status"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Type"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Category"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Description"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Cash In"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Cash Out"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Member"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Show/Project"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Run. Balance"></td>'
                  + '<td><input type="text" class="form-control form-control-sm" placeholder="Notes"></td>'
                  + '<td>'
                    + '<button class="btn btn-sm btn-success save-btn" onclick="SaveClick(event)">Save</button>'
                    + '<button class="btn btn-sm btn-secondary cancel-btn">Cancel</button>'
                  + '</td>';
                document.querySelector('#myBootstrapTable tbody').appendChild(newRow);
            };

            // Event delegation for actions
            function SaveClick(e) {
                console.log("save click");
                const row = e.target.closest('tr');
                const data = row.querySelectorAll('input');
                console.log(data[0].value);
                var newRow = '';
                // build row
                for (let i = 0; i < data.length; i++) {
                    newRow += '<td>' + data[i].value + '</td>';
                }

                row.innerHTML = newRow;
                //if (e.target.classList.contains('save-btn')) {
                    
                //    if (role.value) {
                //        row.innerHTML = '<td>${name.value}</td><td>${role.value}</td><td><button class="btn btn-sm btn-danger delete-btn">Delete</button></td>';
                //    }
                //} else if (e.target.classList.contains('cancel-btn') || e.target.classList.contains('delete-btn')) {
                //    row.remove();
                //}
            };

        </script>

        <br><br><br><br>
        <br><br><br><br>

        <div class="container mt-4">
            <table class="table table-striped table-dark" id="myBootstrapTable">
                <thead>
                </thead>
                <tbody></tbody>
            </table>
            <button class="btn btn-primary" id="addRowBtn" onclick="Update()">Update</button>
            <button class="btn btn-primary" id="btnExport" onclick="ExportClick()">Export CSV</button>
        </div>

        <br><br><br><br>
        <br><br><br><br>

        <form id="formNbrLocs" action=""></form>

    </center>

</body>

</html>
